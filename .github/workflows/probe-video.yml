name: Probe Video (抽畫格看內容)

# 下載一支 Drive 影片,抽等間隔畫格成 jpg,commit 回本分支供人工檢視(寫文案用)。不建廣告。
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Drive 檔案 ID(單一影片)"
        required: false
        default: ""
      folder_id:
        description: "Drive 資料夾 ID(整夾影片)"
        required: false
        default: ""
      frames:
        description: "每支抽幾格"
        required: false
        default: "12"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ads-automation-setup-z1e4wm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r api-engine/requirements.txt
      - name: Extract frames
        working-directory: api-engine
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          PROBE_FILE_ID: ${{ github.event.inputs.file_id }}
          PROBE_FOLDER_ID: ${{ github.event.inputs.folder_id }}
          PROBE_FRAMES: ${{ github.event.inputs.frames }}
        run: python probe_video.py
      - name: Upload frames artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-frames
          path: scratch/video_probe/**/*.jpg
      - name: Commit frames
        run: |
          git config user.name "abc-ads-bot"
          git config user.email "actions@github.com"
          git add -A scratch/video_probe/
          git commit -m "probe: extract frames for copywriting [skip ci]" || echo "nothing to commit"
          git push origin HEAD:claude/ads-automation-setup-z1e4wm || echo "push failed (use artifact)"
