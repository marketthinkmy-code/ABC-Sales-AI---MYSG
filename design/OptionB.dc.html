<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }
    a { color: #6b4eff; } a:hover { color: #4a32d0; }
    .rt { font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  </style>
</helmet>

<div class="rt" style="position: relative; width: 1080px; height: 1350px; background: #c8f135; overflow: hidden;">

  <!-- soft decorative blob -->
  <div style="position: absolute; top: -170px; right: -150px; width: 480px; height: 480px; border-radius: 50%; background: #d6f96b; opacity: 0.6;"></div>

  <!-- ===== HEADLINE ===== -->
  <div style="position: absolute; top: 70px; left: 72px; width: 720px;">
    <div style="font-weight: 900; font-size: 88px; line-height: 1.06; color: #10210a; letter-spacing: -1px;">我請了一個</div>
    <div style="display: inline-block; margin: 12px 0; background: #6b4eff; color: #ffffff; font-weight: 900; font-size: 96px; line-height: 1.05; padding: 6px 24px 12px; border-radius: 18px; box-shadow: 0 9px 0 rgba(16,33,10,0.14); transform: rotate(-1.5deg);">不下班的業務</div>
    <div style="font-weight: 900; font-size: 88px; line-height: 1.06; color: #10210a; letter-spacing: -1px;">幫我把單收好</div>
  </div>

  <!-- ===== STARBURST BADGE ===== -->
  <div style="position: absolute; top: 372px; right: 44px; width: 196px; height: 196px; z-index: 3;">
    <div style="position: absolute; inset: 0; background: #ff4326; border-radius: 28px;"></div>
    <div style="position: absolute; inset: 0; background: #ff4326; border-radius: 28px; transform: rotate(22.5deg);"></div>
    <div style="position: absolute; inset: 0; background: #ff4326; border-radius: 28px; transform: rotate(45deg);"></div>
    <div style="position: absolute; inset: 0; background: #ff4326; border-radius: 28px; transform: rotate(67.5deg);"></div>
    <div style="position: absolute; inset: 18px; background: #ff4326; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ffffff; transform: rotate(-8deg);">
      <div style="font-weight: 700; font-size: 24px; line-height: 1;">限時</div>
      <div style="font-weight: 900; font-size: 46px; line-height: 1.05;">免費</div>
      <div style="font-weight: 700; font-size: 22px; line-height: 1;">直播課</div>
    </div>
  </div>

  <!-- ===== MOCKUP CARD ===== -->
  <div style="position: absolute; top: 458px; left: 72px; width: 848px; background: #ffffff; border-radius: 32px; box-shadow: 0 28px 56px rgba(16,33,10,0.22); padding: 30px 32px 34px;">

    <!-- app header -->
    <div style="display: flex; align-items: center; gap: 15px; padding-bottom: 20px; border-bottom: 2px solid #eef1f4;">
      <div style="width: 60px; height: 60px; border-radius: 50%; background: #10210a; display: flex; align-items: center; justify-content: center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#c8f135" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 0 1-.9-3.8 8.38 8.38 0 0 1 8.5-8.5A8.38 8.38 0 0 1 21 11.5z"/></svg>
      </div>
      <div style="flex-grow: 1;">
        <div style="font-weight: 900; font-size: 30px; color: #10210a;">AI 業務員</div>
        <div style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 21px; color: #12b76a;">
          <span style="width: 11px; height: 11px; border-radius: 50%; background: #12b76a; display: inline-block;"></span>24 小時線上 · LINE / IG / FB
        </div>
      </div>
    </div>

    <!-- chat -->
    <div style="display: flex; flex-direction: column; gap: 16px; padding-top: 22px;">
      <div style="align-self: flex-start; max-width: 72%; background: #eef1f4; color: #10210a; font-weight: 500; font-size: 29px; line-height: 1.38; padding: 17px 24px; border-radius: 24px 24px 24px 6px;">在嗎？這個怎麼賣😅</div>
      <div style="align-self: flex-start; max-width: 72%; background: #eef1f4; color: #10210a; font-weight: 500; font-size: 29px; line-height: 1.38; padding: 17px 24px; border-radius: 24px 24px 24px 6px;">有點貴耶…我再想想🤔</div>

      <div style="align-self: flex-end; max-width: 84%; background: #6b4eff; color: #ffffff; font-weight: 500; font-size: 29px; line-height: 1.4; padding: 18px 24px; border-radius: 24px 24px 6px 24px; box-shadow: 0 8px 18px rgba(107,78,255,0.32);">完全懂！這樣好了，我先幫你留今天名額，週三 3 點帶你看實際效果、成本一次算清楚😊</div>
      <div style="align-self: flex-end; display: flex; align-items: center; gap: 11px; background: #10210a; color: #c8f135; font-weight: 700; font-size: 25px; padding: 15px 22px; border-radius: 24px 24px 6px 24px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c8f135" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        已自動幫你預約 · 週三 15:00
      </div>
    </div>
  </div>

  <!-- ===== ANNOTATION CAPTION ===== -->
  <div style="position: absolute; top: 1022px; left: 72px; width: 848px; display: flex; align-items: center; gap: 14px;">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#10210a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    <div style="font-weight: 900; font-size: 31px; line-height: 1.2; color: #10210a;">自動回覆 · 追單 · 解除疑慮 · 直接約成交</div>
  </div>

  <!-- ===== BRAND BAR ===== -->
  <div style="position: absolute; left: 72px; right: 72px; top: 1116px; display: flex; align-items: center; gap: 18px; background: #10210a; border-radius: 24px; padding: 22px 32px;">
    <div style="width: 62px; height: 62px; border-radius: 16px; background: #c8f135; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#10210a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M9 10h.01M13 10h.01M17 10h.01"/></svg>
    </div>
    <div style="flex-grow: 1;">
      <div style="font-weight: 900; font-size: 35px; color: #ffffff; letter-spacing: 0.5px;">AI 自動回覆・幫你獲客</div>
      <div style="font-weight: 700; font-size: 24px; color: #c8f135;">打造 24 小時自動成交系統</div>
    </div>
    <div style="display: flex; align-items: center; gap: 11px; background: #c8f135; color: #10210a; font-weight: 900; font-size: 27px; padding: 15px 26px; border-radius: 15px;">
      免費報名
      <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#10210a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
