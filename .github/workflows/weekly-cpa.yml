name: Weekly CPA Dashboard

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * 3"   # 每週三 UTC 02:00 = 台北/大馬 10:00

permissions:
  contents: write

jobs:
  cpa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Build CPA dashboard
        working-directory: api-engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          BUYER_SHEET_ID: ${{ secrets.BUYER_SHEET_ID }}
          PRICE_PER_SALE: ${{ secrets.PRICE_PER_SALE }}
        run: python weekly_cpa.py
      - name: Commit report
        run: |
          git config user.name "claude-bot"
          git config user.email "noreply@anthropic.com"
          git add reports/
          git commit -m "weekly CPA dashboard $(date -u +%F)" || echo "no changes"
          git push
