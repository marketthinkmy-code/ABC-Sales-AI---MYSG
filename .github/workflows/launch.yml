name: Launch Ads (自动上广告)

# 手動執行。照 Soo Cheng 結構建 campaign/adset/creative/ad。
# 預設 dry run(只印不建);要真的建廣告，把 live 設 true(廣告仍是 PAUSED，要自己開)。
on:
  workflow_dispatch:
    inputs:
      round:
        description: "本轮标记 (如 R1)"
        required: true
        default: "R1"
      angles:
        description: "角度 key 逗号分隔 (空=priority 1 的角度)"
        required: false
        default: ""
      live:
        description: "true=真的建广告(PAUSED) / false=只试跑"
        required: true
        default: "false"

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Build ABO video campaign from library videos
        working-directory: api-engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ID }}
          PIXEL_ID: ${{ secrets.PIXEL_ID }}
          LANDING_URL: ${{ secrets.LANDING_URL }}
          OBJECTIVE: ${{ secrets.OBJECTIVE }}
          CONVERSION_EVENT: ${{ secrets.CONVERSION_EVENT }}
          # ABO:每個 ad set 每日 500 TWD;30-55 台灣繁中;手動版位
          VIDEO_ADSET_BUDGET: "500"
          VIDEOS_PER_ADSET: "3"
          AGE_MIN: "30"
          AGE_MAX: "55"
          # 建完自動開 ACTIVE(全 16 支都建成才開)
          ACTIVATE: "true"
          DRY_RUN: ${{ github.event.inputs.live == 'true' && 'false' || 'true' }}
        run: python launch_from_library.py
