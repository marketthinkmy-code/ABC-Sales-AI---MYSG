name: Report CPA (campaign lifetime spend)

# 分支上借用這個(已註冊在 main 的)workflow 按需跑 weekly_cpa,
# 產出「每支素材 花費 vs 買單 vs ROAS」戰報,並把排名印到 log。
on:
  workflow_dispatch:
    inputs:
      recent_days:
        description: "近 N 天視窗(近期這幾場),留空=只看 Lifetime"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Per-adset audit of the 預約型 campaign (underspend + CPL)
        working-directory: api-engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          CAMP_ID: "120246810049310658"
          SINCE: "2026-08-25"
        run: python campaign_scale_audit.py
