name: Folder Videos (整夾影片上廣告)

# 把一個 Drive 資料夾的所有影片上成影片廣告(hook 測試,文案用 config)。
# 預設 dry run;live=true 才真的下載/上傳/建(仍 PAUSED)。
on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: "Drive 資料夾 ID"
        required: true
      copy_config:
        description: "文案 config(相對 repo 根)"
        required: false
        default: "config/newhook_copy.json"
      budget:
        description: "ad set 日預算 TWD"
        required: false
        default: "1000"
      suffix:
        description: "campaign 名稱後綴"
        required: false
        default: "新Hook測試"
      live:
        description: "true=真的建廣告(PAUSED) / false=只試跑"
        required: true
        default: "false"

jobs:
  folder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Run launch_folder_videos
        working-directory: api-engine
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ID }}
          PIXEL_ID: ${{ secrets.PIXEL_ID }}
          LANDING_URL: ${{ secrets.LANDING_URL }}
          OBJECTIVE: ${{ secrets.OBJECTIVE }}
          FOLDER_ID: ${{ github.event.inputs.folder_id }}
          COPY_CONFIG: ${{ github.workspace }}/${{ github.event.inputs.copy_config }}
          INTEREST_ADSET_BUDGET: ${{ github.event.inputs.budget }}
          FOLDER_CAMP_SUFFIX: ${{ github.event.inputs.suffix }}
          DRY_RUN: ${{ github.event.inputs.live == 'true' && 'false' || 'true' }}
        run: python launch_folder_videos.py
