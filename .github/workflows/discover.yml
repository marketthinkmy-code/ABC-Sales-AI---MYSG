name: Discover IDs (Page / Pixel / Video)

# 手動執行。撈出帳號的 PAGE_ID / PIXEL_ID / 影片 ID，方便填 launch 設定。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: CPL diagnosis (why is cost per lead high)
        working-directory: api-engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          TREND_DAYS: "90"
          ACTIVE_DAYS: "14"
        run: python cpl_diagnosis.py
