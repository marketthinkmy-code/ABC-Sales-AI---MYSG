name: Creative Pipeline (Drive static image -> ad)

# 把 Drive 資料夾裡做好的靜圖 + config/simage_copies.json 文案 → ABO 圖片廣告
on:
  workflow_dispatch:
    inputs:
      live:
        description: "true=真的建廣告並開ACTIVE / false=只列圖↔文案配對"
        required: true
        default: "false"

permissions:
  contents: write

jobs:
  creative:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Build ABO image ads from Drive folder + provided copies
        working-directory: api-engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ID }}
          PIXEL_ID: ${{ secrets.PIXEL_ID }}
          LANDING_URL: ${{ secrets.LANDING_URL }}
          OBJECTIVE: ${{ secrets.OBJECTIVE }}
          CONVERSION_EVENT: ${{ secrets.CONVERSION_EVENT }}
          # WK 這批 7 張靜圖的資料夾
          DRIVE_FOLDER_ID: "1rkKX_2sYQCPAxwIF_wVLHljDNW1wMiCq"
          # ABO 800 TWD/組;30-55 台灣繁中(locale 22);手動版位;每組≤3
          IMAGE_ADSET_BUDGET: "800"
          TW_LOCALE: "22"
          AGE_MIN: "30"
          AGE_MAX: "55"
          VIDEOS_PER_ADSET: "3"
          ACTIVATE: "true"
          DRY_RUN: ${{ github.event.inputs.live == 'true' && 'false' || 'true' }}
        run: python launch_drive_static.py
