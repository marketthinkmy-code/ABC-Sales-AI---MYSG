name: Spend Audit (哪些廣告該 scale / 砍)

# 手動執行。近 N 天每支有花費的廣告:花費/報名/CPL/成交/CPA/ROAS/判定,
# 並列出「ROAS 好該加預算」與「0 成交該砍」。只讀,只輸出彙總,不印個資。
on:
  workflow_dispatch:
    inputs:
      recent_days:
        description: "分析近幾天 (預設 30)"
        required: false
        default: "30"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Run spend-audit
        working-directory: api-engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          BUYER_SHEET_ID: ${{ secrets.BUYER_SHEET_ID }}
          PRICE_PER_SALE: ${{ secrets.PRICE_PER_SALE }}
          RECENT_DAYS: ${{ github.event.inputs.recent_days }}
        run: python spend_audit.py
