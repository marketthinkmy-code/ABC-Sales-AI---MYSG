name: Report CPA (campaign lifetime spend)

# 分支上借用這個(已註冊在 main 的)workflow 按需跑 weekly_cpa,
# 產出「每支素材 花費 vs 買單 vs ROAS」戰報,並把排名印到 log。
on:
  workflow_dispatch:
    inputs:
      recent_days:
        description: "近 N 天視窗(近期這幾場),留空=只看 Lifetime"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Audit last-N-days spend vs conversion
        working-directory: api-engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          PRICE_PER_SALE: "39800"
          RECENT_DAYS: ${{ github.event.inputs.recent_days }}
        run: python spend_audit.py
