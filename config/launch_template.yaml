# =============================================================
# 冠軍模板 (Launch Template) — ABC Sales AI
# 照抄 Soo Cheng / StockBloom 已驗證結構,換品牌參數。
# 自動上廣告時，系統讀這個檔決定 campaign/adset/creative 的所有設定。
# 每次上新素材只需改 `creatives:` 區塊。
# =============================================================

brand:
  code: "AI獲客-自動"          # 命名前綴，方便在後台認出這是自動化開的
  display_name: "AI 回覆 幫你獲客"

# --- 必填：目標帳號與資產 (先填這 3 個) ---------------------
account:
  # 走 Marketing API 直連(api-engine)，實際值從 GitHub Secrets / .env 讀。
  # 下面是 discover.py 撈出的真實 ID，供對照。
  ad_account_id: "1984262458861966"   # AI 回覆 幫你獲客 (TWD)
  page_id: "1024532770753639"         # FB 粉專
  instagram_id: ""                    # 選填
  pixel_id: "1338102884859245"        # AI 回覆 幫你獲客 register
  currency: "TWD"

# --- Campaign 層 (照抄 Soo Cheng) ---------------------------
campaign:
  objective: "OUTCOME_SALES"            # 報名 webinar = 網站轉換
  buying_type: "AUCTION"
  bid_strategy: "LOWEST_COST_WITHOUT_CAP"   # = "Highest volume"
  budget_level: "campaign"              # CBO；預算下在 campaign 層
  special_ad_categories: []             # 教育/投資類通常空

# --- Ad Set 層 --------------------------------------------
ad_set:
  optimization_goal: "OFFSITE_CONVERSIONS"
  conversion_event: "CompleteRegistration"   # = "Website registrations completed"
  attribution_spec: "7d_click_1d_view"
  daily_budget_myr: 300                  # 起跑預算 (TWD/日)；winner 才往上加 (見 rules)
  geo:
    countries: ["TW"]                    # TWD 帳號 → 台灣；要跑別的地區改這裡
  age_min: 25
  age_max: 55
  genders: "all"
  placements: "advantage_plus"           # 自動版位
  # detailed_targeting 由 angles.yaml 逐角度帶入

# --- Ad / Creative 層 --------------------------------------
# 每次上新素材改這裡。命名見 docs/NAMING.md。
creative_defaults:
  call_to_action: "SIGN_UP"
  landing_url: "https://futureaiemployee.com/ai-closer-register"   # UTM 用 url_tags 自動帶
  display_url: ""

# 有買單的贏家素材(依 2,197 筆真實成交名單排序)。文案為草稿，可再改。
creatives:
  - video_id: "1457047252416770"          # 🥇 M1Video 9 跑過來搶電話 (635 買單)
    primary_text: |
      客戶一傳訊息，AI 立刻「搶著」幫你回——秒回、秒跟進、秒約訪。
      你在忙、在睡、在放假，它都在幫你成交。
      👉 免費登記，看 AI 怎麼幫你搶下每一個客戶：
    headline: "客戶一來，AI 秒搶著回"
  - video_id: "2217182992444876"          # 🥈 M1Video 1 幾點下班 (415 買單)
    primary_text: |
      你幾點下班？AI 員工「不下班」。
      晚上 11 點的訊息、週末的詢問，它照樣秒回、照樣幫你獲客。
      👉 免費登記，讓 AI 幫你 24 小時接單：
    headline: "AI 員工，不下班"
  - video_id: "979324337806118"           # 🥉 M1Video 4 30天挑戰 (215 買單)
    primary_text: |
      給 AI 員工 30 天，讓它幫你自動回覆、自動跟進、自動獲客。
      看看你的詢問轉單率會差多少。
      👉 免費登記，開始你的 30 天挑戰：
    headline: "AI 幫你獲客・30 天挑戰"
  - video_id: "1741559673481640"          # M1Video 11 你有用過 LINE 嗎 (212 買單)
    primary_text: |
      想像一下：LINE / IG / FB 的客戶訊息，全部由 AI 自動回覆、自動篩選、自動約訪。
      AI 員工幫你把每一則訊息都變成成交機會。
      👉 免費登記，親眼看它運作：
    headline: "讓 AI 幫你回 LINE、自動成交"
  - video_id: "2518837468600524"          # M1Video 8 如果你還在用 (211 買單)
    primary_text: |
      如果你還在用人手回訊息、手動跟進——你正在把客戶送給對手。
      AI 員工幫你自動獲客：更快、更便宜、24 小時不打烊。
      👉 免費登記，升級你的獲客方式：
    headline: "還在手動回訊息？該升級了"

# --- 上架安全設定 ------------------------------------------
launch:
  initial_status: "PAUSED"    # 一律先 PAUSED，人工/規則檢查後才統一開
  ads_per_adset: 3            # 對應 Soo Cheng 命名尾碼 "1-1-3"
