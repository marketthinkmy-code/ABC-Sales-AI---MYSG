name: Discover IDs (Page / Pixel / Video)

# 手動執行。撈出帳號的 PAGE_ID / PIXEL_ID / 影片 ID，方便填 launch 設定。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Run video pipeline (Drive video -> ad)
        working-directory: api-engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ID }}
          LANDING_URL: ${{ secrets.LANDING_URL }}
          OBJECTIVE: ${{ secrets.OBJECTIVE }}
          CONVERSION_EVENT: ${{ secrets.CONVERSION_EVENT }}
          DRY_RUN: "false"
          # 只加「新影片」(用 KB 去重),不動已上的
          FORCE_REBUILD: "false"
        run: python video_pipeline.py --round VID1
      - name: Commit KB
        run: |
          git config user.name "claude-bot"
          git config user.email "noreply@anthropic.com"
          git add reports/creatives_kb.json || true
          git commit -m "creatives KB (video) $(date -u +%F)" || echo "no changes"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push || true
