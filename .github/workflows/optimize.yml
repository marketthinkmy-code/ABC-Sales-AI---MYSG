name: Daily Ads Optimize

# 每日自動優化(自動跑)。免伺服器,GitHub 幫你跑。
on:
  schedule:
    - cron: "0 1 * * *"   # UTC 01:00 = 台北/馬來 09:00
  workflow_dispatch: {}    # 也可在 Actions 頁面手動按一下試跑

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r api-engine/requirements.txt
      - name: Run optimize
        working-directory: api-engine
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          OPTIMIZE_WINDOW_DAYS: "30"
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PIXEL_ID: ${{ secrets.PIXEL_ID }}
          LANDING_URL: ${{ secrets.LANDING_URL }}
          OBJECTIVE: ${{ secrets.OBJECTIVE }}
          CONVERSION_EVENT: ${{ secrets.CONVERSION_EVENT }}
          TARGET_CPL: ${{ secrets.TARGET_CPL }}
          KILL_CPL: ${{ secrets.KILL_CPL }}
          SCALE_CPL: ${{ secrets.SCALE_CPL }}
          MAX_DAILY_BUDGET: ${{ secrets.MAX_DAILY_BUDGET }}
          MIN_SPEND_BEFORE_ACTION: ${{ secrets.MIN_SPEND_BEFORE_ACTION }}
          # CPA-first 首版：強制 dry-run 空跑驗證。確認無誤後改回 ${{ secrets.DRY_RUN }} 或設 "false" 上線。
          DRY_RUN: "true"
        run: python optimize.py
