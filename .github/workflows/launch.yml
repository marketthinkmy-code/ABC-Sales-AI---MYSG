name: Launch Ads (自动上广告)

# 手動執行。照 Soo Cheng 結構建 campaign/adset/creative/ad。
# 預設 dry run(只印不建);要真的建廣告，把 live 設 true(廣告仍是 PAUSED，要自己開)。
on:
  workflow_dispatch:
    inputs:
      live:
        description: "true=真的建(仍PAUSED) / false=只列排組"
        required: true
        default: "false"
      adset_budget:
        description: "每個興趣 ad set 每日預算 TWD"
        required: false
        default: "1000"

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Build interest-targeted Winners campaign (8 ad sets, staged PAUSED)
        working-directory: api-engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ID }}
          OBJECTIVE: ${{ secrets.OBJECTIVE }}
          # 一般/舊 pixel(贏家原本漏斗);每組 1000/日;贏家 M1Video 9/1/8
          INTEREST_PIXEL: "1338102884859245"
          INTEREST_EVENT: "COMPLETE_REGISTRATION"
          INTEREST_ADSET_BUDGET: ${{ github.event.inputs.adset_budget }}
          WINNER_NAMES: "M1Video 9,M1Video 1,M1Video 8"
          DRY_RUN: ${{ github.event.inputs.live == 'true' && 'false' || 'true' }}
        run: python launch_interest_winners.py
