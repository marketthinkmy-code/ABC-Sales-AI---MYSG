name: Weekly CPA Dashboard

# 每週 CPA 戰報 + CPA>上限自動關(你的護欄:CPA>2000 關)。MY + SG 各一份。
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * 3"   # 每週三 UTC 02:00 = 馬來/新加坡 10:00

permissions:
  contents: write

concurrency:
  group: weekly-cpa-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  cpa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1        # 序列跑,避免兩市場同時 git push 撞車
      matrix:
        market: [MY, SG]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Build CPA dashboard (${{ matrix.market }})
        working-directory: api-engine
        env:
          MARKET: ${{ matrix.market }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          BUYER_SHEET_ID: ${{ secrets.BUYER_SHEET_ID }}
          PRICE_PER_SALE: ${{ secrets.PRICE_PER_SALE }}
          # CPA>2000 自動關也受 DRY_RUN 保護:true=只印不關。
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: python weekly_cpa.py
      - name: Commit report (${{ matrix.market }})
        run: |
          git config user.name "claude-bot"
          git config user.email "noreply@anthropic.com"
          git add reports/
          git commit -m "weekly CPA ${{ matrix.market }} $(date -u +%F)" || echo "no changes"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push || true
