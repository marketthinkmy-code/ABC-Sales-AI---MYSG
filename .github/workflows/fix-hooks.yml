name: Fix Hooks (補社群行銷 hook + 刪重複)

on:
  workflow_dispatch:
    inputs:
      delete_ads:
        description: "要刪的重複 ad id (逗號分隔)"
        required: false
        default: "120247259808160658"
      live:
        description: "true=真的改 / false=只試跑"
        required: true
        default: "false"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r api-engine/requirements.txt
      - name: Run fix-hooks
        working-directory: api-engine
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          INSTAGRAM_ID: ${{ secrets.INSTAGRAM_ID }}
          PIXEL_ID: ${{ secrets.PIXEL_ID }}
          LANDING_URL: ${{ secrets.LANDING_URL }}
          OBJECTIVE: ${{ secrets.OBJECTIVE }}
          CONVERSION_EVENT: ${{ secrets.CONVERSION_EVENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPY_MODEL: ${{ secrets.COPY_MODEL }}
          INTEREST_ADSET_BUDGET: "300"
          FIX_DELETE_ADS: ${{ github.event.inputs.delete_ads }}
          DRY_RUN: ${{ github.event.inputs.live == 'true' && 'false' || 'true' }}
        run: python fix_hooks.py
